spring.application.name=bico-certo-api
server.port=${PORT:8080}

# Variaveis de ambiente locais (copie .env.example para .env)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (docker-compose sobe o banco na porta 5435)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/bicocerto}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway: o schema e versionado pelos scripts em db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Spring AI - Ollama local
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.retry.max-attempts=1
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=60s

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
