spring.application.name=bico-certo-api
server.port=${PORT:8080}

# Variaveis de ambiente locais (copie .env.example para .env)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (docker-compose sobe o banco na porta 5435)
# DB_URL completa (local) ou DB_HOST/DB_PORT/DB_NAME separados (Render preenche pelo render.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:bicocerto}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway: o schema e versionado pelos scripts em db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# CloudAMQP (nuvem): virtual host proprio e conexao com TLS (porta 5671)
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# Spring AI - Ollama local
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.temperature=0.0
# servico de IA em Python (repositorio bico-certo-ia); vazio = desligado, usa so o Spring AI
bicocerto.ia-servico.url=${IA_SERVICO_URL:}
spring.ai.retry.max-attempts=1
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=60s

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
