# Perfil de testes: H2 em memoria (modo PostgreSQL) rodando as mesmas migrations do Flyway.
# O modelo de IA e o RabbitMQ sao simulados nos testes (nao precisa de Ollama nem de broker).
spring.datasource.url=jdbc:h2:mem:bicocerto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.jwt.secret=segredo-somente-para-testes-automatizados-0123456789
app.jwt.expirationMs=600000
spring.rabbitmq.listener.simple.auto-startup=false
